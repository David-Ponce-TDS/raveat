# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 1536m se queda corto con 14 plugins de Capacitor y obliga a Gradle a recolectar basura
# a mitad del build; 3g le da aire y acorta el tiempo sin costo real en una maquina de
# desarrollo.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# Los modulos de Capacitor son independientes entre si, asi que se compilan en paralelo.
org.gradle.parallel=true

# Reutiliza la salida de tareas que no cambiaron, incluso entre builds distintos. Es lo
# que hace que un rebuild despues de tocar solo el bundle web no rehaga todo el proyecto.
org.gradle.caching=true

# Saltea la fase de configuracion cuando nada de los scripts de build cambio. Gradle lo
# sugiere en cada corrida ("Consider enabling configuration cache").
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# @capacitor-community/speech-recognition (node_modules, no editable) todavia usa
# getDefaultProguardFile('proguard-android.txt'), que AGP 9 rechaza. Sin esta bandera
# la configuracion del proyecto falla. Quitar cuando el plugin publique el arreglo.
android.r8.proguardAndroidTxt.disallowed=false
android.builtInKotlin=false
android.newDsl=false
