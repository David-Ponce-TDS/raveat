<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RavEat</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RavEat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <style>
      html { background-color: #121212; }
      html.tema-claro-inicial { background-color: #ffffff; }
    </style>
    <script>
      // Aplica el tema guardado antes de montar la app para evitar el flash de tema claro (FOUC).
      (function () {
        try {
          var oscuro = localStorage.getItem('raveat_tema') !== 'claro';
          document.documentElement.classList.toggle('ion-palette-dark', oscuro);
          if (!oscuro) document.documentElement.classList.add('tema-claro-inicial');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>

</html>
